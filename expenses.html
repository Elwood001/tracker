<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Expenses Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#000000;--card:#0a0f12;--ink:#e6f7fa;--mute:#7ea2aa;--line:#1a2a30;--acc:#00e5ff;--onacc:#001014;--ok:#2ee6b0;--okbg:#072a26;--deload:#ffc247;--warn:#ff6b81;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
h1{font-size:clamp(34px,8vw,56px);line-height:1}
h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:6px 0 18px}
.sub a{color:var(--acc);font-weight:600}.sub b{color:var(--ink)}
nav{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--acc);margin-bottom:18px}
nav button{font:600 18px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;background:none;border:0;color:var(--mute);padding:8px 14px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:var(--onacc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 13px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;border-top:2px solid var(--ink)}
.weeks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.weeks button{width:40px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:5px;font:600 14px Barlow;cursor:pointer;position:relative}
.weeks button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.weeks button.dl{border-bottom:3px solid var(--deload)}
.weeks button.full{background:var(--okbg);color:var(--ok)}
.weeks button.on.full{background:var(--ok);color:var(--onacc)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.tag{display:inline-block;font:700 13px "Barlow Condensed";letter-spacing:.08em;padding:2px 8px;border-radius:3px;background:var(--deload);color:#1d1b17;text-transform:uppercase}
.day h3{font-size:22px;margin:16px 0 4px;border-left:4px solid var(--acc);padding-left:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.row.done{background:var(--okbg)}
.row.done .nm{text-decoration:line-through;opacity:.7}
.row .nm{flex:1;font-weight:500}
.row small{color:var(--mute);display:block;font-weight:400}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
input[type=number]{width:84px;font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .big{font-size:34px;line-height:1.05}
.stat span{color:var(--mute);font-size:13px}
.ok{color:var(--ok);font-weight:600}.low{color:var(--warn);font-weight:600}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ctl button{font:600 16px Barlow;padding:7px 12px;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:5px;cursor:pointer}
.ctl select{font:inherit;padding:7px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:5px}
.note{color:var(--mute);font-size:13px}
svg text{fill:var(--mute);font:13px Barlow}
html{-webkit-text-size-adjust:100%}
button,label.row{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.row{min-height:52px}
@media (max-width:640px){
 .wrap{padding:14px 12px calc(84px + env(safe-area-inset-bottom,0px))}
 nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;margin:0;gap:0;border:0;border-top:2px solid var(--acc);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);overflow:visible}
 nav button{flex:1;padding:14px 1px;font-size:14px;letter-spacing:.02em;white-space:normal;line-height:1.05}
 nav button.on{background:var(--acc);color:var(--onacc)}
 .weeks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
 .weeks button{width:100%;height:44px;font-size:16px}
 input[type=number]{font-size:16px;width:100%;min-height:44px}
 .ctl select{font-size:16px;flex:1;min-width:0;min-height:44px}
 .ctl button{min-height:44px;min-width:44px}
 .stat .big{font-size:30px}
 .card{padding:12px}
 .wt table,.wt tr,.wt td{display:block;width:100%}
 .wt tr.h{display:none}
 .wt tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
 .wt td{border:0;padding:0;text-align:left}
 .wt td.n{text-align:left}
 .wt td:before{content:attr(data-l);display:block;font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
 svg{min-width:0!important}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Expenses <span>Tracker</span></h1>
<p class="sub">Log what you spend, day by day. Saves in this browser. <span id="sst"></span></p>
<p class="sub" style="margin-top:-10px"><a href="fitness.html">Fitness</a> · <b>Expenses</b></p>
<nav id="nav"></nav>
<main id="view"></main>
</div>
<script>
const W1=46293, N=26, DELOAD=[7,14,21], START=46295, TARGET=46468, SW=89, TW=75, PT=155;
const DAYS_OLD=[
["Monday · Upper (strength)",[["Barbell bench press","4 x 5-6","2-3 min"],["Barbell or chest-supported row","4 x 6-8","2 min"],["Seated dumbbell overhead press","3 x 8-10","90 sec"],["Lat pulldown or pull-ups","3 x 8-10","90 sec"],["Cable triceps pushdown","3 x 10-12","60 sec"],["Dumbbell curl","3 x 10-12","60 sec"]]],
["Tuesday · Lower (strength)",[["Back squat","4 x 5-6","2-3 min"],["Dumbbell step-ups","3 x 8-10 per leg","90 sec"],["Leg press","3 x 10-12","90 sec"],["Leg curl","3 x 10-12","60 sec"],["Standing calf raise","4 x 10-15","60 sec"],["Hanging leg raise or cable crunch","3 x 10-15","60 sec"]]],
["Wednesday · Active recovery",[["Easy walk or cycle","25-30 min",""],["Steps target","10-12k steps",""]]],
["Thursday · Upper (hypertrophy)",[["Incline dumbbell press","4 x 8-10","90 sec"],["Seated cable row","4 x 10-12","90 sec"],["Dumbbell lateral raise","4 x 12-15","60 sec"],["Cable fly or pec deck","3 x 12-15","60 sec"],["Face pull","3 x 15","60 sec"],["Overhead triceps extension","3 x 10-12","60 sec"],["Incline dumbbell curl","3 x 10-12","60 sec"]]],
["Friday · Rest",[["Full rest + steps target","10-12k steps",""]]],
["Saturday · Lower (hypertrophy)",[["Goblet squat","3 x 10-12","90 sec"],["Bulgarian split squat","3 x 8-10 per leg","90 sec"],["Hip thrust","3 x 10-12","90 sec"],["Leg extension","3 x 12-15","60 sec"],["Leg curl","3 x 12-15","60 sec"],["Seated calf raise","4 x 12-15","60 sec"]]],
["Sunday · Cardio (easy pace)",[["Warm-up at easy pace","5 min",""],["Steady cardio (incline walk / bike / cross-trainer)","30-40 min (build to 45-50)",""],["Cool-down + light stretching","5 min",""]]]];

/* ---- New plan (from Wed 25 Nov 2026): 4 lifts + 3 run-walks, posture work ---- */
const NEWSTART=46351, PTN=150, PACE=0.55;
const RUNP=[
["1 min run / 2 min walk x 8 (24 min)","1 min run / 2 min walk x 10 (30 min)"],
["2 min run / 1 min walk x 8 (24 min)","2 min run / 1 min walk x 10 (30 min)"],
["4 min run / 1 min walk x 5 (25 min)","5 min run / 1 min walk x 6 (36 min)"],
["8 min run / 1 min walk x 3 (27 min)","10 min run / 1 min walk x 3 (33 min)"],
["20 min continuous, easy pace","25 min continuous, easy pace"],
["25 min continuous, easy pace","30 min continuous, easy pace"],
["30 min continuous, easy pace","35-40 min continuous (aim for 5 km)"]];
const runIdx=w=>{let k=Math.max(0,w-9);if(DELOAD.includes(w))k=Math.max(0,k-1);return k<2?0:k<4?1:k<6?2:k<8?3:k<10?4:k<12?5:6};
const RUN=(w,t)=>RUNP[runIdx(w)][t];
const PRE=["Warm-up: band pull-aparts 2 x 15, wall slides 2 x 10, thoracic extension 1 min","before lifting",""];
const LWU=["Warm-up: 5 min easy bike or walk + 10 bodyweight squats","before lifting",""];
const MOB=["Posture mobility (5 min)","chin tucks 10 x 5 s, doorway chest stretch 30 s per side, cat-cow x 10",""];
function newDays(w){
 const run=(t,when)=>[["Warm-up: 5 min brisk walk",when,""],["Easy run-walk (talking pace)",RUN(w,t),""],["Cool-down: 5 min walk + calf and hip flexor stretch","",""]];
 return [
 ["Monday · 7 am run + 6:30 pm Upper A (strength)",run(0,"about 7:00 am").concat([PRE,
  ["Barbell bench press","4 x 5-6","2-3 min"],["Barbell or chest-supported row","4 x 6-8","2 min"],["Seated dumbbell overhead press","3 x 8-10","90 sec"],["Lat pulldown or pull-ups","3 x 8-10","90 sec"],["Dumbbell lateral raise","3 x 12-15","60 sec"],["Face pull","3 x 15-20","60 sec"],["Cable triceps pushdown","3 x 10-12","60 sec"]])],
 ["Tuesday · 7 am Lower A (strength)",[LWU,
  ["Back squat","4 x 5-6","2-3 min"],["Dumbbell step-ups","3 x 8-10 per leg","90 sec"],["Leg press","3 x 10-12","90 sec"],["Leg curl","3 x 10-12","60 sec"],["Standing calf raise","4 x 10-15","60 sec"],["Hanging leg raise or cable crunch","3 x 10-15","60 sec"],["Finisher: half-kneeling hip flexor stretch 90 s per side + glute bridge","2 x 15",""]]],
 ["Wednesday · Rest, walk + mobility",[["Easy walk","30-40 min",""],["Steps target","8-10k steps",""],MOB]],
 ["Thursday · 7 am run + 6:30 pm Upper B (pull + rear delts)",run(0,"about 7:00 am").concat([PRE,
  ["Weighted or assisted pull-ups, or lat pulldown","4 x 6-10","2 min"],["Incline dumbbell press","3 x 8-10","90 sec"],["Seated cable row","4 x 10-12","90 sec"],["Dumbbell lateral raise","3 x 12-15","60 sec"],["Face pull","4 x 15-20","60 sec"],["Reverse pec-deck or rear delt fly","4 x 15-20","60 sec"],["Incline dumbbell curl","3 x 10-12","60 sec"],["Overhead triceps extension","3 x 10-12","60 sec"]])],
 ["Friday · 7 am Lower B (hinge)",[LWU,
  ["Romanian deadlift","4 x 6-8","2-3 min"],["Hip thrust","3 x 10-12","90 sec"],["Bulgarian split squat","3 x 8-10 per leg","90 sec"],["Leg extension","3 x 12-15","60 sec"],["Seated calf raise","4 x 12-15","60 sec"],["Farmer's carry","3 x 30-40 m","60 sec"],["Cool-down: hamstring + hip flexor stretch","5 min",""]]],
 ["Saturday · Long run-walk + mobility",run(1,"about 7:00 am").concat([["Steps target","8-10k steps",""],MOB])],
 ["Sunday · Full rest + mobility",[["Full rest","",""],["Steps target","8k+ steps, easy walking",""],MOB]]];
}
const dayPlan=(w,di)=>(W1+(w-1)*7+di<NEWSTART)?DAYS_OLD[di]:newDays(w)[di];
const wkTotal=w=>{let c=0;for(let di=0;di<7;di++)c+=dayPlan(w,di)[1].length;return c};
const MEALS=[["Breakfast","8:00 am","Mess paneer bhurji (~100 g paneer), 1 bowl sprouts, 1 glass milk, ONE carb item (2 idli, 1 uttapam or 1 plate poha)",680,40],["Lunch","12:30 pm","1 bowl dal, one chana / rajma / soya / paneer dish, 2 rotis, 1/2 cup rice, salad, curd or chaas",680,34],["Pre-gym snack","5:00 pm","1 scoop whey in water + 1 banana (skip the mess tiffin snack)",220,26],["Dinner","8:30 pm","1 bowl dal, 1 sabzi, 2 rotis (no ghee), fruit. Skip puri and fried items",510,20],["Whey in milk","9:15 pm","1 scoop whey mixed into 200 ml milk",250,32]];
const MESS=[["Mon","Plain paratha (max 2)","Dal palak, methi matar, curd rice (small)","Dal makhni, kaddu dry, veg jalfrezi","Pav bhaji at tiffin"],
["Tue","Onion uttapam","Paneer do pyaza, tendli chana dry, dal adraki","Dal panchratna, tawa veg, sabji pataudi","Suji halwa"],
["Wed","Aloo poha (1 plate)","Chhole (skip the bhature, take roti), urad dal","Yellow dal, lauki kofta","Boondi laddu"],
["Thu","Mix veg paratha (max 2)","Masala chana, chilka dal tadka, punjabi kadi","Chole (skip the puri, take roti), dal fry","Maggi at tiffin, sewai kheer"],
["Fri","Idli (skip the vada)","Chawli masala, dal makhani, curd","Akka masoor, moong dal, dum aloo","Pani puri, ice cream"],
["Sat","Dal pakwan is fried: 1 only, extra sprouts","Black channa masala, soyabean dry, dal lahsooni, buttermilk, sprout salad","Chilka dal makhani, corn palak, aloo padwal rasa","Mix bhajiya, kala jamun"],
["Sun","Masala dosa (1)","Rajma masala, dalma, sprout salad, curd","Paneer amritsari, dal fry, gajar matar","Cheese burger, fryums, cham cham"]];
const SWAPS=[["Mess paneer bhurji","100 g paneer","Served at breakfast daily. Best veg protein, calorie-dense",265,18],["Sprouts (mess)","1 bowl (~150 g)","Served at breakfast daily, low calorie",120,9],["Any mess dal","1 bowl (150 g)","Lunch and dinner; pair with roti or a little rice",150,10],["Chana / rajma / chole","100 g cooked","Skip the bhature and puri",165,9],["Soyabean dry / soya chunks","100 g cooked","Highest protein per kcal; Sat lunch",130,14],["Curd / chaas","1 bowl (200 g)","Take extra whenever it is served",120,7],["Milk","200 ml","At breakfast; also mix your whey into it",130,7],["Whey","1 scoop (30 g)","Closes the protein gap",120,25],["Roti (whole wheat)","1 medium","Small but it adds up",90,3]];
const PHASES=[["Phase 1","89 to 85 kg","Meal plan above (start here)",2300,2000],["Phase 2","85 to 80 kg","Cut ~100 kcal: drop the 1/2 cup rice at lunch, limit desserts",2200,1950],["Phase 3","80 to 75 kg","Cut ~100 kcal more: drop the banana, keep all protein",2100,1900]];
const LOGCOLS_NEW=[["Breakfast: paneer bhurji + sprouts + milk + 1 carb",40,680,""],["Lunch: dal + chana/rajma/soya dish + 2 rotis",34,680,""],["Whey 1 + banana",26,220,""],["Dinner: dal + sabzi + 2 rotis",20,510,""],["Whey 2 in milk",32,250,""],["Water 3 L+",0,0,""],["Steps 8k+",0,0,""],["Posture: stood up every 30-45 min of study + 5 min mobility",0,0,"pos"],["Slept 7+ hours",0,0,"slp"]];
const LOGCOLS_OLD=[["Breakfast",27,450],["Mid-morning curd",17,250],["Lunch",32,650],["Whey shake 1",25,120],["Banana",1,100],["Whey shake 2",25,120],["Dinner",32,500],["Water 3 L+",0,0],["Steps 10k+",0,0],["Caffeine OK (max 2 cups, none after 2 pm)",0,0],["Slept 7+ hours",0,0]];
LOGCOLS_OLD[9][3]="caf";LOGCOLS_OLD[10][3]="slp";

let S={wk:{},log:{},wt:{},waist:{},exp:[],em:null,tab:"Expenses",week:null,day:null};
try{const r=localStorage.getItem("recomp-v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const OWN=["exp","em","ed","ec"],ALLK=["wk","log","wt","waist","exp","week","day","em","ed","ec"];
const fresh=()=>{try{return JSON.parse(localStorage.getItem("recomp-v1"))||{}}catch(e){return{}}};
const raw=all=>{try{const c=fresh();(all?ALLK:OWN).forEach(k=>{c[k]=S[k]});localStorage.setItem("recomp-v1",JSON.stringify(c))}catch(e){}};
let gt=null;const save=()=>{raw();if(typeof ghOn=="function"&&ghOn()){GH.dirty=1;ghSave();clearTimeout(gt);gt=setTimeout(()=>ghPush(),3000)}};
const serial=d=>Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/864e5);
const fmt=(n,o)=>new Date(Date.UTC(1899,11,30)+n*864e5).toLocaleDateString("en-GB",Object.assign({day:"numeric",month:"short",timeZone:"UTC"},o||{}));
const today=serial(new Date());
if(S.week==null)S.week=Math.min(N,Math.max(1,Math.floor((today-W1)/7)+1));
if(S.day==null)S.day=Math.min(W1+N*7-1,Math.max(W1,today));
const wkDone=w=>{let c=0;for(const k in S.wk)if(k.startsWith(w+":")&&S.wk[k])c++;return c};
const $=s=>document.querySelector(s);
const TABS=["Expenses","Data"];
if(!TABS.includes(S.tab))S.tab=TABS[0];
function nav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${t==S.tab?"on":""}" onclick="S.tab='${t}';MSG='';save();render()">${t}</button>`).join("")}

function workout(){
 const w=S.week,tot=wkTotal(w),done=wkDone(w),pct=Math.round(done/tot*100);
 const type=DELOAD.includes(w)?"DELOAD":w==N?"HOLI":"Cut";
 let h=`<div class="weeks">`+Array.from({length:N},(_,i)=>i+1).map(i=>`<button class="${i==w?"on":""} ${DELOAD.includes(i)?"dl":""} ${wkDone(i)==wkTotal(i)?"full":""}" onclick="S.week=${i};save();render()">${i}</button>`).join("")+`</div>`;
 h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px"><h2>Week ${w} · from ${fmt(W1+(w-1)*7,{weekday:"short"})}</h2><span>${type=="Cut"?"Cut week":`<span class="tag">${type}</span>`} · ${done}/${tot} done</span></div><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>`;
 if(type=="DELOAD")h+=`<p class="note">Deload: cut sets by about 40% (keep the weights), repeat last week's run-walk instead of progressing, and eat near maintenance (~2,700 kcal).</p>`;
 if(type=="HOLI")h+=`<p class="note">Holi week. Planned weight about ${expected(TARGET).toFixed(1)} kg. Keep going to ${TW} kg. 🎉</p>`;
 if(w==9)h+=`<p class="note">New plan starts Wed 25 Nov. Mon 23 and Tue 24 Nov still show the old plan.</p>`;
 if(w>=9)h+=`<p class="note">Runs are always easy: you should be able to talk. If your shins hurt, swap that run for a brisk walk for a few days.</p>`;
 for(let di=0;di<7;di++){const d=dayPlan(w,di);h+=`<div class="day"><h3>${d[0]}</h3>`;d[1].forEach((e,ei)=>{const k=`${w}:${di}:${ei}`;h+=`<label class="row ${S.wk[k]?"done":""}"><input type="checkbox" ${S.wk[k]?"checked":""} onchange="S.wk['${k}']=this.checked;save();render()"><span class="nm">${e[0]}<small>${e[1]}${e[2]?" · rest "+e[2]:""}</small></span></label>`});h+=`</div>`}
 return h+`</div><p class="note">Deload weeks (7, 14, 21) are underlined in amber.</p>`;
}

function meals(){
 const k=MEALS.reduce((a,m)=>a+m[3],0),p=MEALS.reduce((a,m)=>a+m[4],0),whey=50;
 let h=`<div class="stats"><div class="stat"><div class="big">${PTN} g</div><span>daily protein target (~1.7 g/kg)</span></div><div class="stat"><div class="big">${whey} g</div><span>from whey (2 scoops × 25 g)</span></div><div class="stat"><div class="big">${PTN-whey} g</div><span>needed from mess food + milk</span></div></div>`;
 h+=`<div class="card"><h2>Training day · Mon / Tue / Thu / Fri / Sat</h2><div class="scroll"><table><tr><th>Meal</th><th>Time</th><th>What to eat</th><th class="n">Kcal</th><th class="n">Protein</th></tr>`+MEALS.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td><td class="n">${m[3]}</td><td class="n">${m[4]}</td></tr>`).join("")+`<tr class="tot"><td>Total</td><td></td><td></td><td class="n">${k}</td><td class="n">${p} g</td></tr></table></div><p class="note">Rest days (Wed / Sun, about 2,000 kcal): skip the banana and the rice, mix the whey in water, keep the protein. On Tue / Fri / Sat (morning sessions) have the 5 pm whey + banana as an evening snack. Drink 3-4 L water. Consider vitamin B12 (vegetarian).</p></div>`;
 h+=`<div class="card"><h2>Mess guide · menu of 23-29 Nov</h2><div class="scroll"><table><tr><th>Day</th><th>Breakfast carb</th><th>Lunch protein</th><th>Dinner protein</th><th>Limit</th></tr>`+MESS.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td><td>${m[3]}</td><td>${m[4]}</td></tr>`).join("")+`</table></div><p class="note">Mess timings: breakfast 7:30-9:45 am, lunch 12:00-2:15 pm, tiffin 4:30-6:15 pm, dinner 7:30-9:45 pm. Every day: take a big portion of paneer bhurji, sprouts and milk at breakfast. Skip fried items (puri, bhature, pakwan, vada, fryums, papad fry) and have dessert 2-3 times a week at most. Check each week's new menu; the dal + chana/rajma/soya pattern stays the same.</p></div>`;

 const dayList=S.exp.filter(e=>e.d==edS),dayTot=dayList.reduce((x,e)=>x+e.a,0);
 let h=`<div class="card"><h2>Add expense</h2>
<div class="ctl"><button onclick="shiftEd(-1)" aria-label="Previous day">←</button><input id="ed" type="date" value="${ed}" onchange="setEd(this.value)" style="flex:1;min-width:140px;font:inherit;font-size:16px;padding:6px;min-height:44px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)"><button onclick="shiftEd(1)" aria-label="Next day">→</button></div>
<div class="ctl"><button onclick="setEd(isoOf(today))">Today</button><button onclick="setEd(isoOf(today-1))">Yesterday</button><span class="note">${fmt(edS,{weekday:"long",day:"numeric",month:"short"})} · the date stays until you change it</span></div>
<div class="ctl"><input id="ea" type="number" inputmode="decimal" placeholder="Amount ₹" min="0" step="any" value="${F.a??""}" onkeydown="if(event.key=='Enter')addExp()" style="flex:1;min-width:110px"><select id="ec">${CATS.map(c=>`<option ${c==selC?"selected":""}>${c}</option>`).join("")}</select></div>
<div class="ctl"><input id="en" type="text" placeholder="Note (optional)" value="${(F.n||"").replace(/"/g,"&quot;")}" onkeydown="if(event.key=='Enter')addExp()" style="flex:1;min-width:140px;font:inherit;font-size:16px;padding:6px;min-height:44px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)"></div>
<div class="ctl"><button onclick="addExp()" style="background:var(--acc);border-color:var(--acc);color:var(--onacc)">Add expense</button></div>${MSG?`<p class="${MSG.startsWith("Added")?"ok":"low"}" role="status">${MSG}</p>`:""}<p class="note">${dayList.length?"On this day so far: "+inr(dayTot)+" in "+dayList.length+" "+(dayList.length==1?"entry":"entries"):"Nothing logged on this day yet."}</p></div>`;
 h+=`<div class="ctl"><button onclick="shiftM(-1)">←</button><b class="big" style="font-size:24px;flex:1;text-align:center">${mn}</b><button onclick="shiftM(1)">→</button></div>`;
 h+=`<div class="stats"><div class="stat"><div class="big">${inr(tot)}</div><span>spent this month</span></div><div class="stat"><div class="big">${inr(avg)}</div><span>avg per day${cur?" so far":""}</span></div><div class="stat"><div class="big">${peak>0?inr(peak):"–"}</div><span>${peak>0?"highest day (day "+pd+")":"highest day"}</span></div></div>`;
 h+=`<div class="card"><h2>Daily spend</h2><svg viewBox="0 0 700 226" style="width:100%;height:auto">${g}${bars}${ay}${xl}</svg>${tot?"":`<p class="note">No expenses in this month yet.</p>`}</div>`;
 if(tot)h+=`<div class="card"><h2>By category</h2><table>`+Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${c}</td><td class="n">${inr(v)}</td><td class="n">${Math.round(v/tot*100)}%</td></tr>`).join("")+`</table></div>`;
 h+=`<div class="card"><h2>Entries (${list.length})</h2>`+(list.length?list.map(e=>`<div class="row" style="cursor:default"><span class="nm">${e.c}${e.n?" · "+e.n.replace(/[<>&]/g,"")+"":""}<small>${fmt(e.d,{weekday:"short"})}</small></span><b>${inr(e.a)}</b><button onclick="delExp(${e.id})" aria-label="Delete" style="border:1px solid var(--line);background:none;color:var(--mute);border-radius:5px;min-width:40px;min-height:40px;font-size:18px;cursor:pointer">×</button></div>`).join(""):`<p class="note">Nothing here yet.</p>`)+`</div>`;
 return h}

function render(){nav();setTimeout(()=>{const e=document.getElementById("sst");if(e)e.textContent=ghOn()?(GH.conflict?"⚠ cloud differs":GH.dirty?"● not uploaded yet":"☁ synced"):""});const y=window.scrollY;$("#view").innerHTML={"Workout":workout,"Meal Plan":meals,"Daily Log":dailylog,"Weigh-In":weighin,"Expenses":expenses,"Data":dataTab}[S.tab]();window.scrollTo(0,y)}
render();
ghInit();
</script>
</body>
